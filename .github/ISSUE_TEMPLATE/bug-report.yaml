name: Bug 报告
description: 报告 SlimeFun4.1（Slimefun 4）的 Bug 或问题。
labels: ['🎯 Needs testing', '🐞 Bug Report']

body:
- type: markdown
  attributes:
    value: |
      ## 👋 欢迎使用 SlimeFun4.1（非官方维护分支）Bug Tracker
      本仓库与官方 Slimefun 团队无隶属关系——本分支的问题请在此报告，勿提交到官方 Issue Tracker 或 Discord。
      提交前请先查看[已有 Issues](https://github.com/Quotidietium/Slimefun4.1/issues) 是否已有人报告相同问题；排障指引可参考官方 wiki 的 [How to report bugs](https://github.com/Slimefun/Slimefun4/wiki/How-to-report-bugs)。
      <br /><strong><i>带星号（*）的字段为必填项。</i></strong>
      <br />

- id: checklist
  type: checkboxes
  attributes:
    label: '❗ 检查清单'
    description: 创建 Issue 之前，请先逐项确认以下内容。
    options:
    - label: 我使用的是本仓库构建的 SlimeFun4.1（非官方 Slimefun4 分支），且未自行修改 jar。
      required: true
    - label: jar 来自本仓库 Release 或按 README 自行构建，版本以 /sf versions 输出为准（当前发布线 5.1.x）。
      required: true
    - label: 我已尝试升级到本仓库最新发布版本，问题仍然存在。
      required: true
    - label: 我知晓与 Slimefun 附加插件（addons）相关的问题需要报告到各自的 Bug Tracker，而不是这里。
      required: true
    - label: 我搜索过相似的开放 Issues，没有找到已有的相同 Bug 报告。
      required: true

- id: description
  type: textarea
  validations:
    required: true
  attributes:
    label: '📍 问题描述'
    description: |
      请清晰、详细地描述出了什么问题。
      你能提供的信息越多，我们处理这个问题就越容易。
    placeholder: |
      在做 [...] 的时候遇到了 [...]，我确信这不是预期行为，应当被修复。

- id: reproduction-steps
  type: textarea
  validations:
    required: true
  attributes:
    label: '📑 复现步骤'
    description: |
      请告诉我们复现该问题的确切步骤，写得越详细，我们就越容易复现。
    placeholder: |
      1. 做 [...]
      2. 接着做 [...]
      3. 此时出现了 [...]

- id: expected-behaviour
  type: textarea
  validations:
    required: true
  attributes:
    label: '💡 预期行为'
    description: |
      你原本期望发生什么？
      你认为正确的行为应该是什么？
    placeholder: |
      我期望发生 [...]。

- id: media
  type: textarea
  attributes:
    label: '📷 截图 / 视频'
    description: |
      在 Issue 里最直观的说明方式就是录一段视频或截一张图。
      如果你能抓拍到 bug 发生的画面，会对我们帮助很大！
    placeholder: |
      将图片或视频拖拽到此字段即可上传。

- id: server-log
  type: input
  attributes:
    label: '📜 服务器日志'
    description: |
      查看你的服务器日志，并把 Slimefun 相关的报错信息上传到粘贴站（如 https://pastebin.com/）。
      如果拿不准，直接上传完整日志即可，文件位于 /logs/latest.log
    placeholder: https://pastebin.com/...

- id: error-reports
  type: input
  attributes:
    label: '📂 `/error-reports/` 文件夹'
    description: |
      检查 `/plugins/Slimefun/error-reports/` 文件夹，把其中的文件上传到粘贴站（如 https://pastebin.com/）。
    placeholder: https://pastebin.com/...

- id: server-software
  type: dropdown
  validations:
    required: true
  attributes:
    label: '💻 服务端软件'
    description: '请选择你的服务器正在使用的软件'
    options:
      - Spigot
      - Paper
      - Purpur
      - Airplane
      - 其它（请在描述中注明）

- id: minecraft-version
  type: dropdown
  validations:
    required: true
  attributes:
    label: '🎮 Minecraft 版本'
    description: '请选择服务器的 Minecraft 版本'
    options:
      - 1.21.1 ~ 1.21.11（本分支支持范围）
      - 其它版本（不受支持，请在描述中注明）

- id: slimefun-version
  type: textarea
  validations:
    required: true
  attributes:
    label: '⭐ Slimefun 版本'
    description: |
      **"latest"（最新版）不是版本号，我们需要确切的版本。**
      建议运行 "/sf versions" 并上传其输出的截图。
      请确保截图覆盖该命令的完整输出。
    placeholder: Slimefun 版本 [...]

- id: other-versions
  type: textarea
  attributes:
    label: '🧭 其它插件'
    description: |
      如果你的问题与其它插件相关，请务必在此一并列出！
    placeholder: 问题与插件 [...] 相关，版本 [...]

- type: markdown
  attributes:
    value: |
      ## ❤️ 感谢你提交 Bug 报告！
      如果之后发现了任何有助于定位该问题的补充信息，请随时在你的 Issue 下留言！
      任何补充信息都能帮助我们更快修复这个 bug。
